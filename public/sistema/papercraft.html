<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Enfeita Festa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* ===== ESTILOS BASEADOS NO PROJETO DE REFERÊNCIA ===== */
        :root {
            --sidebar-bg: #1b2432;
            --sidebar-hover: #252f3e;
            --sidebar-active: #2d3a4d;
            --sidebar-text: #b0bec5;
            --sidebar-text-active: #ffffff;
            --sidebar-width: 260px;
            --primary: #5e72e4;
            --primary-light: #eef0fd;
            --success: #2dce89;
            --success-light: #e6faf2;
            --warning: #fb6340;
            --warning-light: #ffede8;
            --info: #11cdef;
            --info-light: #e6f9fd;
            --danger: #f5365c;
            --danger-light: #fde8ec;
            --bg-page: #f8f9fa;
            --bg-card: #ffffff;
            --text-primary: #32325d;
            --text-secondary: #8898aa;
            --text-muted: #adb5bd;
            --border-color: #e9ecef;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.2s ease;
            --header-height: 64px;
            --font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { font-size:100%; scroll-behavior:smooth; }
        body { font-family:var(--font-family); background:var(--bg-page); color:var(--text-primary); line-height:1.6; min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased; }
        .app-container { display:flex; min-height:100vh; position:relative; }
        .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:90; transition:opacity var(--transition); }
        .sidebar-overlay.active { display:block; opacity:1; }
        .sidebar { width:var(--sidebar-width); min-width:var(--sidebar-width); background:var(--sidebar-bg); color:var(--sidebar-text); display:flex; flex-direction:column; position:fixed; top:0; left:0; height:100vh; z-index:100; transition:transform var(--transition); overflow-y:auto; overflow-x:hidden; box-shadow:2px 0 20px rgba(0,0,0,0.1); }
        .sidebar-header { padding:1.5rem 1.25rem; display:flex; align-items:center; gap:0.75rem; border-bottom:1px solid rgba(255,255,255,0.06); flex-shrink:0; position:relative; }
        .sidebar-logo { width:40px; height:40px; border-radius:var(--radius-sm); background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:1.25rem; color:#fff; font-weight:700; flex-shrink:0; }
        .sidebar-brand { font-size:1.15rem; font-weight:700; color:#fff; letter-spacing:-0.3px; white-space:nowrap; }
        .sidebar-brand span { color:var(--info); }
        .sidebar-close-btn { display:none; position:absolute; right:14px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:transparent; color:#b0bec5; font-size:1.2rem; cursor:pointer; align-items:center; justify-content:center; z-index:5; transition:all var(--transition); }
        .sidebar-close-btn:hover { background:rgba(255,255,255,0.08); color:#fff; }
        .sidebar-nav { flex:1; padding:1rem 0.75rem; display:flex; flex-direction:column; gap:0.15rem; }
        .sidebar-nav a { display:flex; align-items:center; gap:0.75rem; padding:0.7rem 0.85rem; border-radius:var(--radius-sm); color:var(--sidebar-text); text-decoration:none; font-size:0.88rem; font-weight:500; transition:all var(--transition); white-space:nowrap; cursor:pointer; }
        .sidebar-nav a i { width:20px; text-align:center; font-size:0.95rem; flex-shrink:0; }
        .sidebar-nav a:hover { background:var(--sidebar-hover); color:#d0d8e0; }
        .sidebar-nav a.active { background:var(--primary); color:#fff; font-weight:600; box-shadow:0 4px 12px rgba(94,114,228,0.3); }
        .sidebar-nav a.logout-link { margin-top:auto; color:#e57373; border-top:1px solid rgba(255,255,255,0.06); padding-top:1rem; }
        .sidebar-nav a.logout-link:hover { background:rgba(229,115,115,0.12); color:#ef5350; }
        .main-wrapper { flex:1; margin-left:var(--sidebar-width); display:flex; flex-direction:column; min-height:100vh; transition:margin-left var(--transition); width:calc(100% - var(--sidebar-width)); }
        .header { height:var(--header-height); background:var(--bg-card); border-bottom:1px solid var(--border-color); display:flex; align-items:center; justify-content:space-between; padding:0 1.5rem; position:sticky; top:0; z-index:50; box-shadow:var(--shadow-sm); gap:1rem; flex-shrink:0; }
        .header-left { display:flex; align-items:center; gap:0.75rem; }
        .hamburger-btn { display:none; background:none; border:none; font-size:1.4rem; color:var(--text-primary); cursor:pointer; padding:0.4rem; border-radius:6px; }
        .hamburger-btn:hover { background:var(--bg-page); }
        .header-title { font-size:1.05rem; font-weight:600; color:var(--text-primary); white-space:nowrap; }
        .header-right { display:flex; align-items:center; gap:0.75rem; }
        .header-icon-btn { background:none; border:none; font-size:1.1rem; color:var(--text-secondary); cursor:pointer; padding:0.45rem; border-radius:50%; transition:all var(--transition); width:38px; height:38px; display:flex; align-items:center; justify-content:center; }
        .header-icon-btn:hover { background:var(--bg-page); color:var(--text-primary); }
        .header-avatar { width:36px; height:36px; border-radius:50%; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; cursor:pointer; }
        .content { flex:1; padding:1.5rem; overflow-y:auto; }
        .page-section { display:none; animation:fadeSlideIn 0.3s ease; }
        .page-section.active { display:block; }
        @keyframes fadeSlideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .page-header { margin-bottom:1.75rem; }
        .breadcrumb { display:flex; align-items:center; gap:0.5rem; font-size:0.8rem; color:var(--text-muted); margin-bottom:0.5rem; flex-wrap:wrap; }
        .breadcrumb a { color:var(--text-secondary); text-decoration:none; font-weight:500; transition:color var(--transition); }
        .breadcrumb a:hover { color:var(--primary); }
        .breadcrumb .separator { color:var(--text-muted); user-select:none; }
        .breadcrumb .current { color:var(--text-primary); font-weight:600; }
        .page-title { font-size:1.6rem; font-weight:700; color:var(--text-primary); letter-spacing:-0.4px; margin:0.25rem 0; }
        .page-description { font-size:0.9rem; color:var(--text-secondary); margin:0; line-height:1.5; }
        .cards-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:1rem; margin-bottom:1.5rem; }
        .stat-card { background:var(--bg-card); border-radius:var(--radius-lg); padding:1.25rem 1.35rem; box-shadow:var(--shadow-sm); display:flex; align-items:center; gap:1rem; transition:all var(--transition); border:1px solid var(--border-color); }
        .stat-card:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); }
        .stat-card-icon { width:44px; height:44px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; background:var(--bg-page); }
        .stat-card-icon.receita { color:var(--success); }
        .stat-card-icon.despesa { color:var(--danger); }
        .stat-card-icon.resultado { color:var(--primary); }
        .stat-card-icon.vencidos { color:var(--warning); }
        .stat-card-info { display:flex; flex-direction:column; }
        .stat-card-label { font-size:0.78rem; color:var(--text-secondary); font-weight:500; text-transform:uppercase; letter-spacing:0.3px; }
        .stat-card-value { font-size:1.4rem; font-weight:700; color:var(--text-primary); letter-spacing:-0.3px; }
        .stat-card-sub { font-size:0.75rem; color:var(--text-muted); margin-top:0.1rem; }
        .stat-card-trend { font-size:0.75rem; font-weight:600; margin-top:0.1rem; }
        .stat-card-trend.up { color:var(--success); }
        .stat-card-trend.down { color:var(--danger); }
        .charts-row { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; margin-bottom:1.5rem; }
        .charts-row.asymmetric { grid-template-columns:2fr 1fr; }
        .charts-row.single-col { grid-template-columns:1fr; }
        .chart-card { background:var(--bg-card); border-radius:var(--radius-lg); padding:1.35rem 1.5rem; box-shadow:var(--shadow-sm); border:1px solid var(--border-color); transition:box-shadow var(--transition); }
        .chart-card:hover { box-shadow:var(--shadow-md); }
        .chart-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem; }
        .chart-card-title { font-weight:600; font-size:0.9rem; color:var(--text-primary); display:flex; align-items:center; gap:0.5rem; }
        .chart-card-title i { color:var(--text-muted); font-size:0.95rem; }
        .chart-wrap { position:relative; width:100%; height:280px; }
        .chart-wrap canvas { width:100% !important; height:100% !important; }
        .table-card { background:var(--bg-card); border-radius:var(--radius-lg); padding:1.35rem 1.5rem; box-shadow:var(--shadow-sm); border:1px solid var(--border-color); }
        .table-card-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.75rem; margin-bottom:1rem; }
        .table-card-title { font-weight:600; font-size:0.9rem; color:var(--text-primary); display:flex; align-items:center; gap:0.5rem; }
        .table-card-title i { color:var(--text-muted); font-size:0.95rem; }
        .table-actions { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; }
        .btn { display:inline-flex; align-items:center; gap:0.4rem; padding:0.5rem 1rem; font-size:0.83rem; font-weight:600; border-radius:var(--radius-sm); border:none; cursor:pointer; transition:all var(--transition); white-space:nowrap; font-family:var(--font-family); }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { background:#4a5dd4; box-shadow:0 4px 12px rgba(94,114,228,0.3); }
        .btn-outline { background:#fff; color:var(--primary); border:1.5px solid var(--primary); }
        .btn-outline:hover { background:var(--primary-light); }
        .btn-sm { padding:0.35rem 0.7rem; font-size:0.78rem; border-radius:6px; }
        .btn-success { background:var(--success); color:#fff; }
        .btn-success:hover { background:#26b87a; }
        .btn-ghost { background:transparent; color:var(--text-muted); padding:0.3rem 0.4rem; border-radius:6px; font-size:0.85rem; border:none; cursor:pointer; transition:all var(--transition); }
        .btn-ghost:hover { background:var(--bg-page); color:var(--text-secondary); }
        .btn-ghost.edit:hover { color:var(--primary); }
        .btn-ghost.delete:hover { color:var(--danger); }
        .filter-row { display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; }
        .filter-row input[type="date"], .filter-row select { padding:0.45rem 0.7rem; border:1.5px solid var(--border-color); border-radius:var(--radius-sm); font-size:0.83rem; font-family:var(--font-family); color:var(--text-primary); background:#fff; }
        .filter-row input:focus, .filter-row select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(94,114,228,0.08); }
        .table-responsive { overflow-x:auto; border-radius:var(--radius-sm); -webkit-overflow-scrolling:touch; }
        table { width:100%; border-collapse:collapse; font-size:0.84rem; }
        table thead th { background:#fafbfc; padding:0.7rem 0.85rem; text-align:left; font-weight:600; color:var(--text-secondary); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.3px; border-bottom:1.5px solid var(--border-color); white-space:nowrap; }
        table tbody td { padding:0.65rem 0.85rem; border-bottom:1px solid var(--border-color); vertical-align:middle; color:var(--text-primary); }
        table tbody tr { transition:background var(--transition); }
        table tbody tr:hover { background:#fafbfc; }
        .badge { display:inline-flex; align-items:center; gap:0.35rem; padding:0.2em 0.6em; border-radius:20px; font-size:0.72rem; font-weight:600; }
        .badge-success { background:var(--success-light); color:#1a9c63; }
        .badge-warning { background:#fff8e1; color:#b8860b; }
        .badge-danger { background:var(--danger-light); color:#c62828; }
        .badge-info { background:var(--info-light); color:#0d8fa8; }
        .badge-neutral { background:#f1f3f5; color:#6c757d; }
        .text-success { color:var(--success); font-weight:600; }
        .text-danger { color:var(--danger); font-weight:600; }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; align-items:center; justify-content:center; padding:1rem; }
        .modal-overlay.active { display:flex; }
        .modal { background:#fff; border-radius:var(--radius-lg); width:100%; max-width:600px; max-height:90vh; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,0.12); animation:modalIn 0.3s ease; padding:1.75rem; }
        @keyframes modalIn { from { opacity:0; transform:scale(0.95) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; }
        .modal-header h3 { font-size:1.2rem; font-weight:700; }
        .modal-close { background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted); padding:0.3rem; border-radius:50%; }
        .modal-close:hover { background:#f1f1f1; color:var(--text-primary); }
        .form-group { margin-bottom:1rem; }
        .form-group label { display:block; font-weight:600; font-size:0.8rem; margin-bottom:0.3rem; color:var(--text-primary); }
        .form-group input, .form-group select { width:100%; padding:0.55rem 0.75rem; border:1.5px solid var(--border-color); border-radius:var(--radius-sm); font-size:0.86rem; font-family:var(--font-family); color:var(--text-primary); background:#fafbfc; }
        .form-group input:focus, .form-group select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(94,114,228,0.08); background:#fff; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; }
        .form-actions { display:flex; gap:0.75rem; justify-content:flex-end; margin-top:0.5rem; }

        /* ===== RESPONSIVIDADE PADRÃO ===== */
        @media (max-width: 991px) {
            .charts-row { grid-template-columns:1fr; }
            .charts-row.asymmetric { grid-template-columns:1fr; }
            .form-row { grid-template-columns:1fr; }
            .cards-row { grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); }
        }
        @media (max-width: 767px) {
            .sidebar { transform:translateX(-100%); width:var(--sidebar-width); }
            .sidebar.open { transform:translateX(0); }
            .sidebar-close-btn { display:flex; }
            .main-wrapper { margin-left:0; width:100%; }
            .hamburger-btn { display:flex; }
            .header { padding:0 1rem; }
            .content { padding:1rem; }
            .cards-row { grid-template-columns:1fr; }
            .filter-row { flex-direction:column; align-items:stretch; }
            .filter-row input[type="date"], .filter-row select { width:100%; }
            .page-title { font-size:1.1rem; }
            .stat-card { padding:1rem; }
            .stat-card-value { font-size:1.1rem; }
            table { font-size:0.75rem; }
            table thead th { padding:0.5rem; font-size:0.7rem; }
            table tbody td { padding:0.5rem; }
            .chart-card { padding:1rem; }
            .chart-card-header { flex-direction:column; align-items:flex-start; }
        }
        @media (min-width: 768px) and (max-width: 991px) {
            .cards-row { grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); }
            .charts-row.asymmetric { grid-template-columns:1fr; }
        }
        @media (min-width: 992px) and (max-width: 1199px) {
            .cards-row { grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); }
        }
        @media (min-width: 1200px) {
            .cards-row { grid-template-columns:repeat(4, 1fr); }
        }
        @media (min-width: 1400px) {
            .cards-row { grid-template-columns:repeat(4, 1fr); }
            .charts-row.asymmetric { grid-template-columns:3fr 1fr; }
        }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--border-color); border-radius:3px; }
        ::-webkit-scrollbar-thumb:hover { background:var(--text-muted); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Overlay para mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo"><i class="fas fa-paint-brush"></i></div>
                <div class="sidebar-brand">Enfeita<span></span>Festa</div>
                <button class="sidebar-close-btn" id="sidebarClose"><i class="fas fa-times"></i></button>
            </div>
            <nav class="sidebar-nav">
                <a class="active" data-section="dashboard"><i class="fas fa-th-large"></i> Dashboard</a>
                <a data-section="pedidos"><i class="fas fa-shopping-cart"></i> Pedidos</a>
                <a data-section="produtos"><i class="fas fa-box"></i> Produtos</a>
                <a data-section="fluxo-caixa"><i class="fas fa-exchange-alt"></i> Fluxo de Caixa</a>
                <a data-section="custos-fixos"><i class="fas fa-receipt"></i> Custos Fixos</a>
                <a data-section="relatorios"><i class="fas fa-chart-bar"></i> Relatórios</a>
                <a data-section="dashboard-adicional"><i class="fas fa-chart-pie"></i> Dashboard Adicional</a>
                <a data-section="configuracoes"><i class="fas fa-cog"></i> Configurações</a>
                <a class="logout-link" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </nav>
        </aside>

        <!-- Main wrapper -->
        <div class="main-wrapper" id="mainWrapper">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <button class="hamburger-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
                    <span class="header-title" id="pageTitle">Dashboard</span>
                </div>
                <div class="header-right">
                    <span style="font-size:0.85rem; color: var(--text-secondary);">Maria Papelaria</span>
                    <div class="header-avatar">M</div>
                </div>
            </header>

            <!-- Conteúdo dinâmico -->
            <main class="content" id="contentArea"></main>
        </div>
    </div>

    <!-- Modal genérico -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <script>
        // ---------- DADOS ----------
        let cfg = { hora: 22, shopeeFixa: 3, shopeePerc: 12, taxaPag: 3.99, impostos: 6, metaLucro: 35 };
        let produtos = [
            { cod: 'P001', nome: 'Planner Personalizado A5', cat: 'Planner', preco: 80, custoMat: 22, tempo: 45, margemD: 40 },
            { cod: 'P002', nome: 'Agenda 2026 Capa Dura', cat: 'Agenda', preco: 85, custoMat: 25, tempo: 50, margemD: 38 },
            { cod: 'P003', nome: 'Caderno Espiral Premium', cat: 'Caderno', preco: 80, custoMat: 20, tempo: 40, margemD: 42 },
            { cod: 'P004', nome: 'Kit Adesivos', cat: 'Adesivos', preco: 35, custoMat: 8, tempo: 20, margemD: 50 },
            { cod: 'P005', nome: 'Convite Impresso', cat: 'Convites', preco: 55, custoMat: 12, tempo: 25, margemD: 45 },
        ];
        let pedidos = [
            { id: 1, data: '2026-08-06', market: 'Shopee', cod: 'P001', prod: 'Planner A5', qtd: 3, receita: 240, taxas: 31.8, lucroBruto: 148.5, lucroLiq: 96, margem: 40 },
            { id: 2, data: '2026-08-06', market: 'Instagram', cod: 'P002', prod: 'Agenda 2026', qtd: 2, receita: 170, taxas: 0, lucroBruto: 90, lucroLiq: 68, margem: 40 },
            { id: 3, data: '2026-08-05', market: 'Shopee', cod: 'P004', prod: 'Kit Adesivos', qtd: 5, receita: 175, taxas: 24, lucroBruto: 95, lucroLiq: 59.5, margem: 34 },
        ];
        let custosFixos = [
            { desc: 'Energia', valor: 380 }, { desc: 'Internet', valor: 120 }, { desc: 'Aluguel', valor: 1200 },
            { desc: 'Bling', valor: 89 }, { desc: 'Canva Pro', valor: 55 }, { desc: 'ChatGPT', valor: 105 },
        ];

        // ---------- FUNÇÕES AUXILIARES ----------
        function cmo(t) { return (t / 60) * cfg.hora; }
        function custoTotal(p) { return p.custoMat + cmo(p.tempo); }
        function taxasShopee(r) { return cfg.shopeeFixa + (r * cfg.shopeePerc / 100); }
        function taxasPgto(r) { return r * cfg.taxaPag / 100; }
        function imp(r) { return r * cfg.impostos / 100; }

        function calcularPedidoValues(produto, qtd, market) {
            const rec = produto.preco * qtd;
            let tx = 0;
            if (market === 'Shopee') tx = taxasShopee(rec) + taxasPgto(rec);
            else if (market === 'Site Próprio') tx = taxasPgto(rec);
            const imposto = imp(rec), lb = rec - (custoTotal(produto) * qtd), ll = lb - tx - imposto, mg = (ll / rec) * 100;
            return { rec, tx, imposto, lb, ll, mg };
        }

        // ---------- RENDERIZAÇÃO DAS TELAS ----------
        function renderDashboard() {
            document.getElementById('contentArea').innerHTML = `
                <div class="cards-row">

        // ---------- MODAIS ----------
        function abrirModal(conteudo) {
            document.getElementById('modalContent').innerHTML = conteudo;
            document.getElementById('modalOverlay').classList.add('active');
        }
        function fecharModal() { document.getElementById('modalOverlay').classList.remove('active'); }

        function abrirModalProduto(produto = null) {
            const editando = produto !== null;
            abrirModal(`
                <div class="modal-header"><h3>${editando ? 'Editar Produto' : 'Novo Produto'}</h3><button class="modal-close" onclick="fecharModal()"><i class="fas fa-times"></i></button></div>
                <div class="form-row">
                    <div class="form-group"><label>Código</label><input type="text" id="mCod" value="${editando ? produto.cod : ''}" ${editando ? 'readonly' : ''}></div>
                    <div class="form-group"><label>Nome</label><input type="text" id="mNome" value="${editando ? produto.nome : ''}"></div>
                    <div class="form-group"><label>Categoria</label><input type="text" id="mCat" value="${editando ? produto.cat : ''}"></div>
                    <div class="form-group"><label>Preço Venda R$</label><input type="number" step="0.01" id="mPreco" value="${editando ? produto.preco : ''}"></div>
                    <div class="form-group"><label>Custo Material R$</label><input type="number" step="0.01" id="mCustoMat" value="${editando ? produto.custoMat : ''}"></div>
                    <div class="form-group"><label>Tempo (min)</label><input type="number" id="mTempo" value="${editando ? produto.tempo : ''}"></div>
                    <div class="form-group"><label>Margem Desejada %</label><input type="number" step="0.1" id="mMargem" value="${editando ? produto.margemD : ''}"></div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
                    <button class="btn btn-primary" onclick="salvarProduto('${editando ? produto.cod : ''}')">Salvar</button>
                </div>`);
        }
        function salvarProduto(codOriginal) {
            const cod = document.getElementById('mCod').value.trim();
            const nome = document.getElementById('mNome').value;
            const cat = document.getElementById('mCat').value;
            const preco = +document.getElementById('mPreco').value;
            const custoMat = +document.getElementById('mCustoMat').value;
            const tempo = +document.getElementById('mTempo').value;
            const margemD = +document.getElementById('mMargem').value;
            if (!cod || !nome) return alert('Código e nome são obrigatórios.');
            if (codOriginal) {
                const idx = produtos.findIndex(p => p.cod === codOriginal);
                if (idx >= 0) produtos[idx] = { cod, nome, cat, preco, custoMat, tempo, margemD };
            } else {
                if (produtos.some(p => p.cod === cod)) return alert('Código já existe.');
                produtos.push({ cod, nome, cat, preco, custoMat, tempo, margemD });
            }
            fecharModal();
            renderProdutosView();
        }
        function editarProduto(cod) { const p = produtos.find(x => x.cod === cod); if (p) abrirModalProduto(p); }
        function excluirProduto(cod) { if (confirm('Excluir produto ' + cod + '?')) { produtos = produtos.filter(p => p.cod !== cod); renderProdutosView(); } }

        function abrirModalPedido(pedido = null) {
            const editando = pedido !== null;
            abrirModal(`
                <div class="modal-header"><h3>${editando ? 'Editar Pedido' : 'Novo Pedido'}</h3><button class="modal-close" onclick="fecharModal()"><i class="fas fa-times"></i></button></div>
                <div class="form-row">
                    <div class="form-group"><label>Data</label><input type="date" id="pedData" value="${editando ? pedido.data : new Date().toISOString().split('T')[0]}"></div>
                    <div class="form-group"><label>Marketplace</label><select id="pedMarket">
                        <option ${editando && pedido.market==='Shopee'?'selected':''}>Shopee</option>
                        <option ${editando && pedido.market==='Instagram'?'selected':''}>Instagram</option>
                        <option ${editando && pedido.market==='Site Próprio'?'selected':''}>Site Próprio</option>
                        <option ${editando && pedido.market==='WhatsApp'?'selected':''}>WhatsApp</option>
                    </select></div>
                    <div class="form-group"><label>Cód Produto</label><input type="text" id="pedCod" value="${editando ? pedido.cod : ''}" onchange="atualizarResumoPedido()"></div>
                    <div class="form-group"><label>Quantidade</label><input type="number" id="pedQtd" value="${editando ? pedido.qtd : 1}" min="1" onchange="atualizarResumoPedido()"></div>
                </div>
                <div id="pedResumo" style="margin:1rem 0; padding:0.75rem; background:#f8f9fa; border-radius:6px; font-size:0.85rem;">${editando ? 'Resumo será atualizado' : 'Preencha o código do produto'}</div>
                <div class="form-actions">
                    <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
                    <button class="btn btn-primary" onclick="salvarPedido(${editando ? pedido.id : 'null'})">Salvar</button>
                </div>`);
            if (editando) atualizarResumoPedido();
        }
        function atualizarResumoPedido() {
            const cod = document.getElementById('pedCod')?.value.trim();
            const qtd = +document.getElementById('pedQtd')?.value || 1;
            const market = document.getElementById('pedMarket')?.value || 'Shopee';
            const p = produtos.find(x => x.cod.toLowerCase() === cod?.toLowerCase());
            if (!p) { const resumo = document.getElementById('pedResumo'); if (resumo) resumo.innerHTML = 'Produto não encontrado.'; return; }
            const vals = calcularPedidoValues(p, qtd, market);
            const resumo = document.getElementById('pedResumo');
            if (resumo) resumo.innerHTML = `Receita: R$ ${vals.rec.toFixed(2)} | Taxas: R$ ${vals.tx.toFixed(2)} | Lucro Bruto: R$ ${vals.lb.toFixed(2)} | Lucro Líq: R$ ${vals.ll.toFixed(2)} | Margem: ${vals.mg.toFixed(1)}%`;
        }
        function salvarPedido(idOriginal) {
            const cod = document.getElementById('pedCod').value.trim();
            const qtd = +document.getElementById('pedQtd').value;
            const market = document.getElementById('pedMarket').value;
            const data = document.getElementById('pedData').value;
            const p = produtos.find(x => x.cod.toLowerCase() === cod.toLowerCase());
            if (!p) return alert('Produto não encontrado.');
            const vals = calcularPedidoValues(p, qtd, market);
            if (idOriginal) {
                const idx = pedidos.findIndex(ped => ped.id === idOriginal);
                if (idx >= 0) pedidos[idx] = { ...pedidos[idx], data, market, cod: p.cod, prod: p.nome, qtd, ...vals };
            } else {
                const newId = pedidos.length ? Math.max(...pedidos.map(p => p.id)) + 1 : 1;
                pedidos.unshift({ id: newId, data, market, cod: p.cod, prod: p.nome, qtd, ...vals });
            }
            fecharModal();
            renderPedidosView();
        }
        function editarPedido(id) { const p = pedidos.find(x => x.id === id); if (p) abrirModalPedido(p); }
        function excluirPedido(id) { if (confirm('Excluir pedido?')) { pedidos = pedidos.filter(p => p.id !== id); renderPedidosView(); } }

        function abrirModalCustoFixo(custo = null) {
            abrirModal(`
                <div class="modal-header"><h3>${custo ? 'Editar Custo Fixo' : 'Novo Custo Fixo'}</h3><button class="modal-close" onclick="fecharModal()"><i class="fas fa-times"></i></button></div>
                <div class="form-row">
                    <div class="form-group"><label>Descrição</label><input type="text" id="mDesc" value="${custo ? custo.desc : ''}"></div>
                    <div class="form-group"><label>Valor R$</label><input type="number" step="0.01" id="mValor" value="${custo ? custo.valor : ''}"></div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
                    <button class="btn btn-primary" onclick="salvarCustoFixo(${custo ? custosFixos.indexOf(custo) : -1})">Salvar</button>
                </div>`);
        }
        function salvarCustoFixo(index) {
            const desc = document.getElementById('mDesc').value;
            const valor = +document.getElementById('mValor').value;
            if (!desc) return;
            if (index >= 0) custosFixos[index] = { desc, valor };
            else custosFixos.push({ desc, valor });
            fecharModal();
            renderCustosFixosView();
        }
        function editarCustoFixo(i) { abrirModalCustoFixo(custosFixos[i]); }
        function excluirCustoFixo(i) { if (confirm('Excluir custo?')) { custosFixos.splice(i, 1); renderCustosFixosView(); } }

        // ---------- NAVEGAÇÃO ----------
        const pageTitle = document.getElementById('pageTitle');
        const sectionMap = {
            'dashboard': { title: 'Dashboard', render: renderDashboard },
            'produtos': { title: 'Produtos', render: renderProdutosView },
            'pedidos': { title: 'Pedidos', render: renderPedidosView },
            'fluxo-caixa': { title: 'Fluxo de Caixa', render: () => document.getElementById('contentArea').innerHTML = `<div class="table-card"><div class="table-card-header"><div class="table-card-title"><i class="fas fa-exchange-alt"></i> Fluxo de Caixa</div></div><div class="table-responsive"><table><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th></tr></thead><tbody><tr><td>06/08</td><td>Venda Shopee</td><td><span class="badge badge-success">Entrada</span></td><td>R$ 240</td></tr></tbody></table></div></div>` },
            'custos-fixos': { title: 'Custos Fixos', render: renderCustosFixosView },
            'relatorios': { title: 'Relatórios', render: renderRelatoriosView },
            'dashboard-adicional': { title: 'Dashboard Adicional', render: renderDashboardAdicional },
            'configuracoes': { title: 'Configurações', render: renderConfiguracoes }
        };

        function navigateTo(section) {
            const info = sectionMap[section];
            if (!info) return;
            info.render();
            pageTitle.textContent = info.title;
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
            document.querySelector(`.sidebar-nav a[data-section="${section}"]`)?.classList.add('active');
            closeSidebar();
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        });
        document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
        document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
        document.querySelectorAll('.sidebar-nav a[data-section]').forEach(a => {
            a.addEventListener('click', () => navigateTo(a.dataset.section));
        });
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) fecharModal();
        });

        navigateTo('dashboard');
    </script>
</body>
</html>
