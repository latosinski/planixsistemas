<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Craft</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class="fas fa-paint-brush"></i></div>
                <div class="logo-text">Paper_<span>Craft</span></div>
                <button class="sidebar-close-btn" id="sidebarClose"><i class="fas fa-times"></i></button>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">Principal</div>
                <a class="nav-item active" data-section="dashboard"><i class="fas fa-th-large"></i> Dashboard</a>
                <a class="nav-item" data-section="pedidos"><i class="fas fa-shopping-cart"></i> Pedidos</a>
                <a class="nav-item" data-section="produtos"><i class="fas fa-box"></i> Produtos</a>
                <a class="nav-item" data-section="custos-fixos"><i class="fas fa-receipt"></i> Custos Fixos</a>
                <a class="nav-item" data-section="marketplaces"><i class="fas fa-store"></i> Marketplaces</a>
                <div class="nav-section">Financeiro</div>
                <a class="nav-item" data-section="fornecedores"><i class="fas fa-truck"></i> Fornecedores</a>
                <a class="nav-item" data-section="contas"><i class="fas fa-file-invoice-dollar"></i> Contas a Pagar</a>
                <a class="nav-item" data-section="relatorios"><i class="fas fa-chart-bar"></i> Relatórios</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-card">
                    <div class="user-avatar">PC</div>
                    <div class="user-info">
                        <div class="user-name">Paper Craft</div>
                        <div class="user-role">Administrador</div>
                    </div>
                </div>
            </div>
        </aside>
        <div class="main-wrapper" id="mainWrapper">
            <header class="header">
                <div class="header-left">
                    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                    <span class="page-title" id="pageTitle">Dashboard</span>
                </div>
                <div class="header-right">
                    <button class="header-btn" id="themeToggle" title="Alternar tema"><i class="fas fa-moon"></i></button>
                    <span style="font-size:0.85rem; color: var(--text-light);">Paper Craft</span>
                    <div class="header-avatar">PC</div>
                </div>
            </header>
            <main class="content" id="contentArea"></main>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <script src="js/store.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils/calculos.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/produtos.js"></script>
    <script src="js/modules/pedidos.js"></script>
    <script src="js/modules/custosFixos.js"></script>
    <script src="js/modules/marketplaces.js"></script>
    <script src="js/modules/fornecedores.js"></script>
    <script src="js/modules/contas.js"></script>
    <script src="js/modules/relatorios.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
