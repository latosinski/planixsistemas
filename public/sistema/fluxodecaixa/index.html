<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluxo de Caixa - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="overlay" class="overlay"></div>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="logo">FC</div>
        <div class="brand-text">
          <b>FluxoCaixa</b>
          <small>Gestão Financeira</small>
        </div>
        <button id="close-sidebar" class="sidebar-close-btn" aria-label="Fechar menu">×</button>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-title">VISÃO GERAL</div>
      <button class="nav-link active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></button>
      <button class="nav-link" data-page="lancamentos"><i class="fas fa-plus-circle"></i> <span>Lançamentos</span></button>
      <button class="nav-link" data-page="fluxo-caixa"><i class="fas fa-chart-line"></i> <span>Fluxo de Caixa</span></button>
      <div class="nav-title">FINANCEIRO</div>
      <button class="nav-link" data-page="metas"><i class="fas fa-bullseye"></i> <span>Metas</span></button>
      <button class="nav-link" data-page="dre"><i class="fas fa-file-invoice"></i> <span>DRE</span></button>
      <button class="nav-link" data-page="contas-pagar"><i class="fas fa-hand-holding-usd"></i> <span>Contas a Pagar</span></button>
      <button class="nav-link" data-page="contas-receber"><i class="fas fa-piggy-bank"></i> <span>Contas a Receber</span></button>
      <div class="nav-title">GESTÃO</div>
      <button class="nav-link" data-page="analise-financeira"><i class="fas fa-chart-area"></i> <span>Análise Financeira</span></button>
      <button class="nav-link" data-page="projecao"><i class="fas fa-chart-line"></i> <span>Projeção</span></button>
      <button class="nav-link" data-page="valores-abertos"><i class="fas fa-exclamation-triangle"></i> <span>Valores em Aberto</span></button>
      <button class="nav-link" data-page="plano-contas"><i class="fas fa-list-alt"></i> <span>Plano de Contas</span></button>
      <button class="nav-link" data-page="relatorio-impressao"><i class="fas fa-print"></i> <span>Relatório p/ Impressão</span></button>
    </nav>
    <div class="sidebar-footer">
      <button id="logout-btn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> <span>Sair</span></button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="main-header">
      <div class="top-left">
        <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
          <span class="menu-icon-open"><i class="fas fa-bars"></i></span>
          <span class="menu-icon-close"><i class="fas fa-times"></i></span>
        </button>
        <div class="crumb">FluxoCaixa / <b id="crumb">Dashboard</b></div>

        <div class="period-selector" id="period-selector">
          <button class="period-nav" id="period-prev" aria-label="Mês anterior">
            <i class="fas fa-chevron-left"></i>
          </button>
          <button class="period-display" id="period-display" aria-haspopup="true" aria-expanded="false">
            <i class="fas fa-calendar-alt"></i>
            <span id="period-label">Setembro/2026</span>
            <i class="fas fa-chevron-down period-caret"></i>
          </button>
          <button class="period-nav" id="period-next" aria-label="Próximo mês">
            <i class="fas fa-chevron-right"></i>
          </button>

          <div class="period-dropdown hidden" id="period-dropdown">
            <div class="period-dropdown-year">
              <button class="period-year-nav" id="period-year-prev"><i class="fas fa-chevron-left"></i></button>
              <span id="period-year-label">2026</span>
              <button class="period-year-nav" id="period-year-next"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="period-dropdown-months" id="period-months"></div>
            <div class="period-dropdown-footer">
              <button class="btn btn-primary" id="period-hoje">Mês atual</button>
            </div>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button id="dark-mode-toggle" class="icon-btn" aria-label="Alternar tema"><i class="fas fa-moon"></i></button>
        <button id="refresh-btn" class="icon-btn" aria-label="Atualizar dados"><i class="fas fa-sync-alt"></i></button>
        <span id="current-date" class="current-date"></span>
        <div class="avatar">MR</div>
      </div>
    </header>
    <main id="main-content" class="main-content"></main>
  </div>

  <div id="modal-container" class="modal-container hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button id="modal-close" class="icon-btn"><i class="fas fa-times"></i></button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="confirm-container" class="modal-container hidden">
    <div class="modal-content" style="max-width:440px;">
      <div class="modal-header">
        <h3 id="confirm-title">Confirmação</h3>
        <button id="confirm-close" class="icon-btn"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <p id="confirm-message" style="margin-bottom:1.2rem; white-space:pre-line;"></p>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button id="confirm-cancel" class="btn">Cancelar</button>
          <button id="confirm-ok" class="btn btn-primary">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="js/modules/utils.js"></script>
  <script src="js/modules/storage.js"></script>
  <script src="js/modules/period-store.js"></script>
  <script src="js/modules/ui.js"></script>
  <script src="js/modules/router.js"></script>
  <script src="js/modules/charts.js"></script>
  <script src="js/modules/export.js"></script>
  <script src="data/sample-data.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/lancamentos.js"></script>
  <script src="js/pages/fluxo-caixa.js"></script>
  <script src="js/pages/metas.js"></script>
  <script src="js/pages/dre.js"></script>
  <script src="js/pages/contas-pagar.js"></script>
  <script src="js/pages/contas-receber.js"></script>
  <script src="js/pages/valores-abertos.js"></script>
  <script src="js/pages/plano-contas.js"></script>
  <script src="js/pages/relatorio-impressao.js"></script>
  <script src="js/pages/analise-financeira.js"></script>
  <script src="js/pages/projecao.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
