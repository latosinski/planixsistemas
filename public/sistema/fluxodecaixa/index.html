<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluxo de Caixa - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="overlay" class="overlay"></div>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h1 class="logo">FluxoCaixa</h1>
      <button id="close-sidebar" class="btn-icon" aria-label="Fechar menu">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li><a href="#dashboard" class="nav-link active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
        <li><a href="#lancamentos" class="nav-link" data-page="lancamentos"><i class="fas fa-plus-circle"></i> <span>Lançamentos</span></a></li>
        <li><a href="#fluxo-caixa" class="nav-link" data-page="fluxo-caixa"><i class="fas fa-chart-line"></i> <span>Fluxo de Caixa</span></a></li>
        <li><a href="#metas" class="nav-link" data-page="metas"><i class="fas fa-bullseye"></i> <span>Metas</span></a></li>
        <li><a href="#dre" class="nav-link" data-page="dre"><i class="fas fa-file-invoice"></i> <span>DRE</span></a></li>
        <li><a href="#contas-pagar" class="nav-link" data-page="contas-pagar"><i class="fas fa-hand-holding-usd"></i> <span>Contas a Pagar</span></a></li>
        <li><a href="#contas-receber" class="nav-link" data-page="contas-receber"><i class="fas fa-piggy-bank"></i> <span>Contas a Receber</span></a></li>
        <li><a href="#valores-abertos" class="nav-link" data-page="valores-abertos"><i class="fas fa-exclamation-triangle"></i> <span>Valores em Aberto</span></a></li>
        <li><a href="#plano-contas" class="nav-link" data-page="plano-contas"><i class="fas fa-list-alt"></i> <span>Plano de Contas</span></a></li>
        <li><a href="#relatorio-impressao" class="nav-link" data-page="relatorio-impressao"><i class="fas fa-print"></i> <span>Relatório p/ Impressão</span></a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <button id="logout-btn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> <span>Sair</span></button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="main-header">
      <button id="menu-toggle" class="btn-icon hamburger" aria-label="Abrir menu">
        <i class="fas fa-bars"></i>
      </button>
      <div class="header-actions">
        <button id="dark-mode-toggle" class="btn-icon" aria-label="Alternar tema">
          <i class="fas fa-moon"></i>
        </button>
        <button id="refresh-btn" class="btn-icon" aria-label="Atualizar dados">
          <i class="fas fa-sync-alt"></i>
        </button>
        <span id="current-date" class="current-date"></span>
      </div>
    </header>
    <main id="main-content" class="main-content">
      <!-- Conteúdo dinâmico -->
    </main>
  </div>

  <div id="modal-container" class="modal-container hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button id="modal-close" class="btn-icon"><i class="fas fa-times"></i></button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Bibliotecas externas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Módulos da aplicação -->
  <script src="js/modules/storage.js"></script>
  <script src="js/modules/ui.js"></script>
  <script src="js/modules/router.js"></script>
  <script src="js/modules/charts.js"></script>
  <script src="js/modules/export.js"></script>
  <script src="data/sample-data.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/lancamentos.js"></script>
  <script src="js/pages/fluxo-caixa.js"></script>
  <script src="js/pages/metas.js"></script>
  <script src="js/pages/dre.js"></script>
  <script src="js/pages/contas-pagar.js"></script>
  <script src="js/pages/contas-receber.js"></script>
  <script src="js/pages/valores-abertos.js"></script>
  <script src="js/pages/plano-contas.js"></script>
  <script src="js/pages/relatorio-impressao.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
